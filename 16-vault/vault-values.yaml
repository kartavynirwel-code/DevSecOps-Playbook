# vault-values.yaml — production-style HA Vault (Raft + TLS + AWS KMS auto-unseal)
# Chart: hashicorp/vault        Install:
#   helm repo add hashicorp https://helm.releases.hashicorp.com && helm repo update
#   helm install vault hashicorp/vault -n vault --create-namespace -f vault-values.yaml
#
# BEFORE INSTALLING you must have:
#   1. A TLS Secret "vault-tls" in namespace "vault" (keys: tls.crt, tls.key, ca.crt)
#      with SANs: vault, vault.vault, vault.vault.svc, vault.vault.svc.cluster.local,
#                 *.vault-internal, *.vault-internal.vault.svc.cluster.local, 127.0.0.1
#   2. An AWS KMS key + IAM permissions (kms:Encrypt, kms:Decrypt, kms:DescribeKey)
#      attached to the Vault ServiceAccount (IRSA / EKS Pod Identity) or the node instance profile
#   3. A StorageClass that supports volume expansion (gp3 on AWS)
# Replace every <PLACEHOLDER> below.

global:
  enabled: true
  tlsDisable: false            # TLS ON. Never set true outside a throwaway lab.

injector:
  enabled: false               # We use External Secrets Operator, not the Agent Injector.

server:
  # Pin an exact version in real use (don't float on "latest"):
  # image:
  #   repository: hashicorp/vault
  #   tag: "X.Y.Z"

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: "1"

  # Mount the TLS secret at /vault/userconfig/vault-tls
  extraVolumes:
    - type: secret
      name: vault-tls

  extraEnvironmentVars:
    VAULT_ADDR: "https://127.0.0.1:8200"
    VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt
    VAULT_TLSCERT: /vault/userconfig/vault-tls/tls.crt
    VAULT_TLSKEY: /vault/userconfig/vault-tls/tls.key

  # Probes: the chart default below reports a SEALED or UNINITIALISED pod as Ready (HTTP 204).
  # That is intentional: it lets `helm install --wait` finish and lets you exec in to
  # init/unseal. The trade-off is that a sealed pod still looks "1/1 Ready".
  # Detect sealed pods with:  kubectl get pods -n vault -L vault-sealed,vault-active
  # (labels come from service_registration "kubernetes" below), or with `vault status`.
  # Stricter option: readiness path "/v1/sys/health?standbyok=true" (sealed pods become 0/1),
  # but then you must install without --wait and unseal manually the first time.
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    initialDelaySeconds: 60

  # Persistent storage for Raft data and audit logs
  dataStorage:
    enabled: true
    size: 20Gi
    storageClass: gp3
  auditStorage:
    enabled: true
    size: 10Gi
    storageClass: gp3

  # One Vault pod per node/AZ: losing a node must never cost quorum
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ template "vault.name" . }}
              app.kubernetes.io/instance: "{{ .Release.Name }}"
              component: server
          topologyKey: kubernetes.io/hostname

  # Run as non-root, read-only root filesystem friendly defaults are set by the chart.
  # Keep it that way; don't override securityContext to run as root.

  # ServiceAccount used for auto-unseal credentials and for Kubernetes auth token review.
  serviceAccount:
    create: true
    name: vault
    annotations:
      eks.amazonaws.com/role-arn: "<VAULT_KMS_IAM_ROLE_ARN>"   # EKS IRSA. Remove on self-managed clusters using an instance profile.

  # Do not expose Vault with a public LoadBalancer/Ingress. Reach it via ClusterIP,
  # VPN, or an internal load balancer only.
  service:
    type: ClusterIP

  ingress:
    enabled: false

  # Keep at most one pod down during node drains/upgrades (needs 3+ replicas for quorum)
  # PDB is created by the chart when ha.enabled = true.

  ha:
    enabled: true
    replicas: 3                # 3 (tolerates 1 failure) or 5 (tolerates 2). Always odd.
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true   # Containers can't reliably mlock; keep swap disabled on nodes instead.

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file       = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file        = "/vault/userconfig/vault-tls/tls.key"
          tls_client_ca_file  = "/vault/userconfig/vault-tls/ca.crt"
          tls_min_version     = "tls12"
          telemetry {
            unauthenticated_metrics_access = "false"
          }
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr         = "https://vault-0.vault-internal:8200"
            leader_ca_cert_file     = "/vault/userconfig/vault-tls/ca.crt"
            leader_client_cert_file = "/vault/userconfig/vault-tls/tls.crt"
            leader_client_key_file  = "/vault/userconfig/vault-tls/tls.key"
          }
          retry_join {
            leader_api_addr         = "https://vault-1.vault-internal:8200"
            leader_ca_cert_file     = "/vault/userconfig/vault-tls/ca.crt"
            leader_client_cert_file = "/vault/userconfig/vault-tls/tls.crt"
            leader_client_key_file  = "/vault/userconfig/vault-tls/tls.key"
          }
          retry_join {
            leader_api_addr         = "https://vault-2.vault-internal:8200"
            leader_ca_cert_file     = "/vault/userconfig/vault-tls/ca.crt"
            leader_client_cert_file = "/vault/userconfig/vault-tls/tls.crt"
            leader_client_key_file  = "/vault/userconfig/vault-tls/tls.key"
          }
        }

        # Auto-unseal: pods unseal themselves after restarts. No human with unseal keys needed.
        seal "awskms" {
          region     = "us-east-1"
          kms_key_id = "<KMS_KEY_ID>"
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname          = true
        }

ui:
  enabled: true
  serviceType: ClusterIP

# Optional: Prometheus Operator integration (needs kube-prometheus-stack CRDs)
serverTelemetry:
  serviceMonitor:
    enabled: false
